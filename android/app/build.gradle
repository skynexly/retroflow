apply plugin: 'com.android.application'

// ============================================================================
// 版本与签名：全部从外部 properties 读取，禁止在此硬编码。
//   android/version.properties  —— 由 scripts/sync-version.js 生成，入库，
//                                  唯一事实源是 scripts/version.js
//   android/keystore.properties —— 存签名口令，已被 .gitignore 排除，不入库。
//                                  缺失时（如他人 clone 本公开仓库）release 构建
//                                  自动降级为 debug 签名，保证仍可编译。
// ============================================================================
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty('versionCode') ?: '1').toInteger()
def appVersionName = versionProps.getProperty('version') ?: '1.0'

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseSigning = false
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    def storePath = rootProject.file(keystoreProps.getProperty('storeFile'))
    hasReleaseSigning = storePath.exists()
}

android {
    namespace "com.retroflow.project"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.retroflow.project"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
                storeType keystoreProps.getProperty('storeType') ?: 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 有 release keystore 就用它签名；没有则退回 debug 签名，
            // 让公开仓库的 clone 者也能构建（无法覆盖安装正式包，但能跑起来）。
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

if (!hasReleaseSigning) {
    logger.warn('[retroflow] 未找到 android/keystore.properties 或 release.keystore，' +
                'release 构建将使用 debug 签名（仅供 clone 者本地验证）。')
} else {
    logger.lifecycle("[retroflow] release 签名已启用：alias=${keystoreProps.getProperty('keyAlias')} " +
                     "versionCode=${appVersionCode} versionName=${appVersionName}")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
